name: Test
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Test
    # The go directive in go.mod tracks the latest Go release, and setup-go
    # pins GOTOOLCHAIN=local, so an oldstable job cannot build the module.
    # Widen this back into a matrix if go.mod ever drops below stable.
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: stable
      - name: Build
        run: go build ./...
      - name: Test
        run: go test -race ./...

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: stable
      - name: Check formatting (gofumpt)
        run: |
          unformatted=$(go tool gofumpt -l .)
          if [ -n "$unformatted" ]; then
            echo "::error::The following files are not gofumpt-formatted:"
            echo "$unformatted"
            exit 1
          fi
      - name: Vet
        run: go vet ./...
      - name: Staticcheck
        run: go tool staticcheck ./...

  govulncheck:
    name: Vulnerability scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: stable
      - name: Run govulncheck
        run: go tool govulncheck ./...
